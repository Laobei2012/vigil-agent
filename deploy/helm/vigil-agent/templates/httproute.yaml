{{- if .Values.httpRoute.enabled }}
# Only the PagerDuty webhook path is public. The receiver checks the HMAC signature.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "vigil.name" . }}
  labels: {{- include "vigil.labels" . | nindent 4 }}
spec:
  parentRefs: {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    - {{ .Values.httpRoute.hostname | quote }}
  rules:
    - matches:
        - path: {type: Exact, value: /webhooks/pagerduty}
          method: POST
      backendRefs:
        - name: {{ include "vigil.name" . }}-orchestrator
          port: 8080
{{- end }}
