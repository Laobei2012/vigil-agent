# Read-only access for the Kubernetes tools. No secrets, no pods/exec, pods/attach,
# pods/portforward, or serviceaccounts/token, and only get, list, and watch.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "vigil.name" . }}-k8s-reader
  labels: {{- include "vigil.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, endpoints, configmaps, events, persistentvolumeclaims,
                serviceaccounts, nodes, namespaces, persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
{{- range .Values.rbac.extraRules }}
  - apiGroups: {{ toJson .apiGroups }}
    resources: {{ toJson .resources }}
    verbs: [get, list, watch]
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vigil.name" . }}-k8s-reader
  labels: {{- include "vigil.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "vigil.name" . }}-k8s-reader
  labels: {{- include "vigil.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "vigil.name" . }}-k8s-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "vigil.name" . }}-k8s-reader
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vigil.name" . }}-orchestrator
  labels: {{- include "vigil.labels" . | nindent 4 }}
automountServiceAccountToken: false
